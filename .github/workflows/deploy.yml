name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  preview:
    name: Deploy de preview
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Puxar a configuração do ambiente de preview
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar o preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview publicado em $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar a URL no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n### Preview publicado\n\n${url}\n\nCommit \`${context.sha.slice(0, 7)}\`.`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  production:
    name: Deploy de produção
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Puxar a configuração de produção
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construir para produção
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar em produção
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Produção publicada em $url" >> "$GITHUB_STEP_SUMMARY"
